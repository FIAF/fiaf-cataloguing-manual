        - Identifying Aggregates: appendices/aggregates/identifying_aggregates/index.md
        - Types of Moving Image Aggregates: appendices/aggregates/types_of_moving_image_aggregates/index.md
        - Titling of Aggregates: appendices/aggregates/titling_of_aggregates/index.md
        - Modelling Aggregates: appendices/aggregates/modelling_aggregates/index.md
