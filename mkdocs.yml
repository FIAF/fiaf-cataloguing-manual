        - Example 2. Documentary film in 4-level hierarchy: appendices/record-examples/example_two/index.md
        - Example 3. Silent feature film in 3-level Hierarchy Model: appendices/record-examples/example_three/index.md
        - Example 4. Short feature film in 3-level Hierarchy Model: appendices/record-examples/example_four/index.md
        - Example 5. Home Movie in 3-level Hierarchy Model: appendices/record-examples/example_five/index.md
        - Example 6. Television Serial and Episode records: appendices/record-examples/example_six/index.md
        - Example 7. Aggregate DVD Television Serial and Episode records: appendices/record-examples/example_seven/index.md
      - Bibliography:
