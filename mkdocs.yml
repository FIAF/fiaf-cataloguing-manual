site_name: FIAF Moving Image Cataloguing Manual
site_description: International Federation of Film Archives Moving Image Cataloguing Manual
docs_dir: markdown
repo_url: https://github.com/FIAF/fiaf-cataloguing-manual
repo_name: FIAF/fiaf-cataloguing-manual
edit_uri: edit/develop/markdown/


theme:
  name: material
  # features:
  #   - navigation.indexes

extra_css:
  - stylesheets/extra.css

plugins:
  # - awesome-pages
  - search
  - section-index
  - nav-numbering:
       headings_depth: 0
       headings_depth: 3
       headings_start_level: 5
        # Optional configurations:
        # max_nav_depth: 3
        # max_heading_depth: 4
  - enumerate-headings:
      toc_depth: 2
      increment_across_pages: true
      strict: false

markdown_extensions:
  - attr_list
  - toc:
      permalink: true
      toc_depth: 3



nav:
  - Home: index.md
  - Dedication: dedication/index.md
  - Acknowledgements: acknowledgements/index.md
  - Quick Guide for New Archivists: quick-guide/index.md
  - Introduction: introduction/index.md

  - Preliminary:
    - Purpose, Scope, and Use:
      - preliminary/purpose_scope_and_use/index.md
      - Purpose: preliminary/purpose_scope_and_use#custom-anchor
      - Scope: preliminary/purpose_scope_and_use#custom-anchor2
      - Use: preliminary/purpose_scope_and_use#custom-anchor3

    - Core Elements of Description:
        - preliminary/core_elements_of_description/index.md
    - Sources of Information: preliminary/prelim_sources_of_information/index.md
    - Display Issues: preliminary/display_issues/index.md
    - Language and Script of the Description: preliminary/language_and_script_of_the_description/index.md
    - Abbreviations: preliminary/abbreviations/index.md
    - Examples: preliminary/examples/index.md
    - Errors: preliminary/errors/index.md
    - Alternatives and Options: preliminary/alternatives_and_options/index.md

  - "Section":
    - "Page":
      - guide/index.md
      - "test1": guide#custom-anchor
      - "test2": guide#custom-anchor2

