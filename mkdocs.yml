site_name: FIAF Moving Image Cataloguing Manual
site_description: International Federation of Film Archives Moving Image Cataloguing Manual
docs_dir: markdown
repo_url: https://github.com/FIAF/fiaf-cataloguing-manual
repo_name: FIAF/fiaf-cataloguing-manual
edit_uri: edit/181-static-site/markdown/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - content.action.view
    - content.footnote.tooltips
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.instant.prefetch
    - search.highlight
    - search.suggest
    - toc.follow
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

hooks:
  - hooks/heading_numbers.py

plugins:
  - search

nav:
  - Home: index.md
  - Manual:
    - Preliminary:
      - preliminary/index.md
      - Purpose, Scope, and Use: preliminary/purpose_scope_and_use/index.md
      - Core Elements of Description: preliminary/core_elements_of_description/index.md
      - Sources of Information: preliminary/prelim_sources_of_information/index.md
      - Display Issues: preliminary/display_issues/index.md
      - Language and Script of the Description: preliminary/language_and_script_of_the_description/index.md
      - Abbreviations: preliminary/abbreviations/index.md
      - Examples: preliminary/examples/index.md
      - Errors: preliminary/errors/index.md
      - Alternatives and Options: preliminary/alternatives_and_options/index.md
    - Works:
      - works/index.md
      - Attributes of a Moving Image Work: works/attributes_of_a_moving_image_work_variant/index.md
      - Work/Variant Description Types: works/work_variant_description_types/index.md
      - Elements of a Work: works/elements_of_a_work_variant/index.md
      - Language Usage Types: works/language_usage_types/index.md
      - Relationships of a Work/Variant: works/relationships_of_a_work_variant/index.md
    - Variants:
      - variants/index.md
      - Attributes of a Variant: variants/attributes_of_a_variant/index.md
      - Elements of a Variant: variants/elements_of_a_variant/index.md
      - Relationships of a Work/Variant: variants/relationships_of_a_work_variant/index.md
    - Manifestations:
      - manifestations/index.md
      - Attributes of a Manifestation: manifestations/attributes_of_a_manifestation/index.md
      - Manifestation Types: manifestations/manifestation_types/index.md
      - Theatrical Distribution: manifestations/theatrical_distribution/index.md
      - Elements of a Manifestation: manifestations/elements_of_a_manifestation/index.md
      - Relationships of a Manifestation: manifestations/relationships_of_a_manifestation/index.md
    - Items:
      - items/index.md
      - Elements of a Moving Image Item: items/elements_of_a_moving_image_item/index.md
      - Relationships of an Item: items/relationships_of_an_item/index.md
    - Boundaries between Records:
      - boundaries/index.md
      - Boundaries between Manifestations: boundaries/boundaries_between_manifestations/index.md
      - Boundaries between Manifestations and Events: boundaries/boundaries_between_manifestations_and_events/index.md
      - Boundaries between Items: boundaries/boundaries_between_items/index.md
    - Agents:
      - agents/index.md
      - Agents for Manifestations: agents/agents_for_manifestations/index.md
      - Manifestation Agent Types: agents/manifestation_agent_types/index.md
      - Agents for Items: agents/agents_for_items/index.md
    - Events:
      - events/index.md
      - Events (Works/Variants): events/events_summary/index.md
      - Event Type: events/event_type/index.md
      - Events - Manifestations: events/events_manifestations/index.md
      - Manifestation Publication Types: events/publication/index.md
      - Events - Items: events/events_manifestations-2/index.md
      - Manifestation/Item Acquisition, Accessioning and Source: events/accessioning_and_source/index.md
    - Other Relationships:
      - other-relationships/index.md
      - Other Relationships for Works, Variants, Manifestations, Items: other-relationships/other_relationships_for_works_variants_manifestations_items/index.md
    - Appendices:
      - Titles and Title Types:
        - appendices/titles/index.md
        - Title Types: appendices/titles/title_types/index.md
        - Moving Images with Probable or Questionable Titles: appendices/titles/moving_images_with_probable_or_questionable_titles/index.md
        - Titling of Aggregates: appendices/titles/title_titling_of_aggregates/index.md
      - Cataloguer's Notes:
