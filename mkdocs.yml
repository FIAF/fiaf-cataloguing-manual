site_name: FIAF Moving Image Cataloguing Manual
site_description: International Federation of Film Archives Moving Image Cataloguing Manual
docs_dir: markdown
repo_url: https://github.com/FIAF/fiaf-cataloguing-manual
repo_name: FIAF/fiaf-cataloguing-manual
edit_uri: edit/181-static-site/markdown/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - content.action.view
    - content.footnote.tooltips
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

hooks:
  - hooks/heading_numbers.py

plugins:
  - search

nav:
  - Home: index.md
  - Manual:
    - Preliminary:
      - 00_preliminary/index.md
      - Dedication, Acknowledgements & Introduction: 00_preliminary/index.md
      - Purpose, Scope, and Use: 00_preliminary/purpose_scope_and_use/index.md
      - Core Elements of Description: 00_preliminary/core_elements_of_description/index.md
      - Sources of Information: 00_preliminary/prelim_sources_of_information/index.md
