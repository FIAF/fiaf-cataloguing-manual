<svg width="620" height="850" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="800" height="1200" style="fill: orange;"></rect><rect x="0" y="0" width="620" height="850" style="fill: rgb(238, 238, 238);"></rect><rect x="0" y="0" rx="10" width="620" height="50" opacity="0.5" style="fill: lightgreen;"></rect><text class="header_text" x="310" y="35" font-family="brownstd" font-size="32px" font-weight="400" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" stroke-width="0px" stroke="orange" fill="black">Extended hierarchy model: 4 levels</text><rect x="150" y="70" rx="10" width="400" height="160" opacity="0.5" style="fill: purple;"></rect><rect x="0" y="60" rx="10" width="180" height="180" opacity="0.5" style="fill: orange;"></rect><text class="header_text" x="90" y="150" font-family="brownstd" font-size="24px" font-weight="400" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" stroke-width="0px" stroke="orange" fill="black">Work<tspan x="90" font-size="12px" dy="20">abstract entity</tspan></text><rect x="150" y="260" rx="10" width="400" height="160" opacity="0.5" style="fill: purple;"></rect><rect x="0" y="250" rx="10" width="180" height="180" opacity="0.5" style="fill: orange;"></rect><text class="header_text" x="90" y="340" font-family="brownstd" font-size="24px" font-weight="400" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" stroke-width="0px" stroke="orange" fill="black">Variant<tspan x="90" font-size="12px" dy="20">abstract entity</tspan><tspan x="90" font-size="12px" dy="20">optional</tspan></text><rect x="150" y="450" rx="10" width="400" height="160" opacity="0.5" style="fill: purple;"></rect><rect x="0" y="440" rx="10" width="180" height="180" opacity="0.5" style="fill: orange;"></rect><text class="header_text" x="90" y="530" font-family="brownstd" font-size="24px" font-weight="400" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" stroke-width