<body>
    <div id="graph"></div>
    <script>
        
        // define svg.
        
        let svg = d3.select('#graph').append('svg').attr('width', 612).attr('height', 612).attr('xmlns', 'http://www.w3.org/2000/svg');

        // add rect across region of svg, should be white.
        
        svg.append("rect")
            .attr("x", 0)
            .attr("y", 0)
            .attr("width", 650)
            .attr("height", 1200)
            .style("fill", "orange");

        // add cover image, source higher-res copy if possible.
        
        svg.append("svg:image")
            .attr("href", 'cover.png') 
            .attr("x", 0) 
            .attr("y", 0) 
            .attr("width", 612) 
            .attr("height", 612);
