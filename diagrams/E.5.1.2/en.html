<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <div id="graph"></div>
    <script>
        
        // define the svg.

        let svg = d3.select('#graph').append('svg').attr('width', 600).attr('height', 400).attr('xmlns', 'http://www.w3.org/2000/svg');

        // this step is possibly redundant.

        svg.append("rect")
            .attr("x", 0)
            .attr("y", 0)
            .attr("width", 600)
            .attr("height", 400)
            .style("fill", "white");

        // we assume here that text is already presplit on linebreaks.

        let nodes = [
            {
                'top': 'hello', 'cla': 'sab', 'lines': [
                    { "text": "Sabrina", "x": 100, "y": 50 },
                    { "text": "(1954) (Work)", "x": 100, "y": 50 }
                ]
            },
            // {
            //     'top': 'hello', 'cla': 'aud', 'lines': [
            //         { "text": "The Audrey Hepburn Collection", "x": 300, "y": 50 },
            //         { "text": "(2008) (Work)", "x": 300, "y": 50 }
            //     ]
            // },
            {
                'top': 'hello', 'cla': 'fun', 'lines': [
                    { "text": "Funny Face", "x": 300, "y": 50 },
                    { "text": "(1956) (Work)", "x": 300, "y": 50 }
                ]
            },


            {
                'top': 'hello', 'cla': 'bre', 'lines': [
                    { "text": "Breakfast at Tiffanys", "x": 500, "y": 50 },
                    // { "text": "Tiffanys", "x": 500, "y": 150 },
                    { "text": "(1961) (Work)", "x": 500, "y": 50 }
                ]
            },


            {
                'top': 'hello', 'cla': 'dvd1', 'lines': [
                    { "text": "The Audrey Hepburn Collection", "x": 300, "y": 250 },
                    { "text": "(DVD Manifestation, 2008) (Collection Aggregate)", "x": 300, "y": 250 },
                    
                ]
            },
            
            {
                'top': 'hello', 'cla': 'dvd2', 'lines': [
                    { "text": "The Audrey Hepburn Collection", "x": 300, "y": 350 },
                    { "text": "(DVD Item)", "x": 300, "y": 350 },
                    
                ]
            },

        ]

        let links = [

        {"a":"sab", "b":"dvd1", "direct":"TD"},
        {"a":"fun", "b":"dvd1", "direct":"TD"},
        {"a":"bre", "b":"dvd1", "direct":"TD"},
            {"a":"dvd1", "b":"dvd2", "direct":"TD"},
            // {"a":"sab", "b":"aud", "direct":"LR"},
            // {"a":"aud", "b":"fun", "direct":"LR"},
            // {"a":"bre", "b":"aud", "direct":"LR"},
        ]

        // write initial text. use css for text charateristics.

        nodes.forEach(
            d => {
                let textElement = svg.selectAll('g')
                    .data(d['lines'])
                    .join('text')
                    .attr("class", d.cla) // class should be at box level
                    .attr('x', d => d.x)
                    .attr('y', (d, i) => (d.y) + (i * 20))
                    .attr('font-family', 'brownstd')
                    .attr('font-size', '12px')
                    .attr('font-weight', '100')
                    .attr('text-anchor', 'middle')
                    .attr('alignment-baseline', 'middle')
                    .attr('stroke', 'black')
                    .attr('fill', 'black')
                    .text(d => d.text);
            })

        // function to collect bounding boxes by class.

        function get_box(classroom) {

            var elements = d3.selectAll("." + classroom);
            var minX = Infinity;
            var minY = Infinity;
            var maxX = -Infinity;
            var maxY = -Infinity;

            elements.each(function () {
                var bbox = this.getBoundingClientRect();
                minX = Math.min(minX, bbox.left - 8);
                minY = Math.min(minY, bbox.top - 11);
                maxX = Math.max(maxX, bbox.right - 8);
                maxY = Math.max(maxY, bbox.bottom - 12);
            });

            return { 'x': minX, 'y': minY, 'width': maxX - minX, 'height': maxY - minY }

        }

        // apply function

        nodes.forEach((d) => d.class_bbox = get_box(d.cla))

        // apply bounding

        svg.selectAll('g')
            .data(nodes)
            .join('rect')
            .attr('class', d => d.cla+'_box')
            .attr('x', d => d.class_bbox.x-4)
            .attr('y', d => d.class_bbox.y-4)
            .attr('width', d => d.class_bbox.width+8)
            .attr('height', d => d.class_bbox.height+8)
            .attr('stroke', 'black')
            .attr('stroke-width', '1px')
            .attr('opacity', 1)
            .attr('fill', 'white')

        // apply links between bounding boxes.

        links.forEach(
            d => {

                x1 = parseFloat(d3.selectAll('.'+d.a+'_box').attr('x'))
                y1 = parseFloat(d3.selectAll('.'+d.a+'_box').attr('y'))
                h1 = parseFloat(d3.selectAll('.'+d.a+'_box').attr('height'))
                w1 = parseFloat(d3.selectAll('.'+d.a+'_box').attr('width'))

                x2 = parseFloat(d3.selectAll('.'+d.b+'_box').attr('x'))
                y2 = parseFloat(d3.selectAll('.'+d.b+'_box').attr('y'))
                h2 = parseFloat(d3.selectAll('.'+d.b+'_box').attr('height'))
                w2 = parseFloat(d3.selectAll('.'+d.b+'_box').attr('width'))

                // const curve = d3.line().curve(d3.curveBumpX);
                const curve = d3.line().curve(d3.curveBumpY);

                // curveStep

                if (d.direct == "LR") {
                svg.selectAll('g')
                    .data([''])
                    .join('path')
                    .attr("class", "links_yes")
                    .attr('d', d => curve([[x1+(w1), y1+(h1/2)], [x2, y2+(h2/2)]]))
                    .attr('stroke', 'black')
                    .attr('fill', 'none');
                }



                if (d.direct == "TD") {
                svg.selectAll('g')
                    .data([''])
                    .join('path')
                    .attr("class", "links_yes")
                    .attr('d', d => curve([[x1+(w1/2), y1+h1], [x2+(w2/2), y2]]))
                    .attr('stroke', 'black')
                    .attr('fill', 'none');
                }
            
            }
        )

        // overwrite text

        nodes.forEach(
            d => {
                svg.selectAll('g')
                    .data(d['lines'])
                    .join('text')
                    .attr("class", d.cla) // class should be at box level
                    .attr('x', d => d.x)
                    .attr('y', (d, i) => (d.y) + (i * 20))
                    .attr('font-family', 'brownstd')
                    .attr('font-size', '12px')
                    .attr('font-weight', '100')
                    .attr('text-anchor', 'middle')
                    .attr('alignment-baseline', 'middle')
                    .attr('stroke', 'black')
                    .attr('fill', 'black')
                    .text(d => d.text);
            })

    </script>
</body>

</html>
