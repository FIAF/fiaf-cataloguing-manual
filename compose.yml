services:
  mkdocs:
    image: python:3.12-slim
    container_name: manual-mkdocs
    ports:
      - 8000:8000
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && mkdocs serve --dev-addr 0.0.0.0:8000"

  # PDF edition: docker compose run --rm pdf  ->  pdf/out/fiaf-cataloguing-manual.pdf
  pdf:
    profiles: [pdf]
    image: python:3.12-slim
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "apt-get update -qq &&
      apt-get install -y -qq --no-install-recommends chromium libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core fonts-noto-color-emoji git >/dev/null &&
      pip install -q -r pdf/requirements.txt &&
      python pdf/build_pdf.py"
