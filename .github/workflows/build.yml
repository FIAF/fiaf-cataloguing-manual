name: ci 
on:
  push:
    branches:
      - '**' 

permissions:
  contents: write

jobs:
  deploy:
  
    if: github.ref == 'refs/heads/develop'
  
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: | 
          pip install mkdocs==1.6.1
          pip install mkdocs-material==9.7.6
          pip install mkdocs-nav-numbering-plugin==1.3.0

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force

  # Builds the PDF edition on every push and attaches it to the workflow run
  # (Actions → run → Artifacts). It is not published anywhere yet.
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pdf/requirements.txt

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-color-emoji

      - name: Install Python dependencies
        run: pip install -r pdf/requirements.txt

      - name: Cache rendered diagrams
        uses: actions/cache@v4
        with:
          path: pdf/.cache
          key: pdf-diagrams-${{ hashFiles('markdown/diagrams/*.svg') }}
          restore-keys: pdf-diagrams-

      # The runner image ships Google Chrome, which renders the diagrams.
      - name: Build PDF
        run: python pdf/build_pdf.py

      - uses: actions/upload-artifact@v4
        with:
          name: fiaf-cataloguing-manual-pdf
          path: pdf/out/fiaf-cataloguing-manual.pdf
          retention-days: 30
        
