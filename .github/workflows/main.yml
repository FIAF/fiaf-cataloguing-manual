name: compile_manual
on:
  push:
    branches:
      - 'main'
      - 'develop'
jobs:
  compile:
    runs-on: ubuntu-latest 
    # permissions:
      # contents: write  
    steps:
    - name: checkout repo
      uses: actions/checkout@v3
    - name: check branch
      run: git branch
    - name: install required apps 
      run: sudo apt install pandoc texlive-xetex fossil fonts-firacode  
    - name: install font 
      run: cp -r src/font/ /usr/share/fonts/BrownStd    
    - name: remove render dir
      run: rm -rf src/render 
    - name: remake render dir
      run: mkdir src/render
      
    - name: check dir
      run: ls src/render 

      
    - name: run script
      run: cd src && ./local.sh 
    
    - name: check dir
      run: ls src/render 
    
      
