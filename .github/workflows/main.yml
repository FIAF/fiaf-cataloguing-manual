name: compile_manual
on:
  push:
    branches:
      - main
jobs:
  compile:
    runs-on: ubuntu-latest 
    permissions:
      contents: write  
    steps:
    - name: checkout repo
      uses: actions/checkout@v3
    - name: install pandoc
      run: sudo apt install pandoc
    - name: install xelatex
      run: sudo apt install texlive-xetex
    - name: download font
      run: | 
          curl -O https://font.download/dl/font/brownstd.zip
          unzip brownstd.zip -d brownstd
          cp -r brownstd ~/.fonts/brownstd
    - name: test markdown list
      run: |
        MARKDOWN=$(find markdown -type f -name '*.md' | sort)
        pandoc $MARKDOWN --pdf-engine=xelatex -o manual.pdf
    - name: check results
      run: ls -al
