name: compile_manual
on:
  push:
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: checkout repo
      uses: actions/checkout@v3
    - name: check branch
      run: git branch
    - name: docker image
      run: cd src && docker compose up -d
    - name: build process
      run: docker exec manual /app/src/build.sh
    - name: install b2sdk
      run: pip3 install b2sdk
    - name: run blaze script
      env:
        BACKBLAZE_APP_KEY: ${{ secrets.BACKBLAZE_APP_KEY }}
        BACKBLAZE_APP_KEY_ID: ${{ secrets.BACKBLAZE_APP_KEY_ID }}
        BRANCH_NAME: ${{ github.ref }}
      run: python3 src/blaze.py
