name: compile_manual
on:
  push:
    branches:
      - main
      - v1.0
jobs:
  compile:
    runs-on: ubuntu-latest 
    permissions:
      contents: write  
    steps:
    - name: checkout repo
      uses: actions/checkout@v3
    - name: check branch
      run: git branch
    - name: install pandoc and 
      run: sudo apt install pandoc graphicsmagick      
    - name: check results
      run: ls -al
    - name: run compile script
      run: ./compile.sh
      
