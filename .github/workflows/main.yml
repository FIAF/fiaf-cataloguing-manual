name: compile_manual
on:
  push
jobs:
  compile:
    runs-on: ubuntu-latest 
    permissions:
      contents: write  
    steps:
    - name: checkout repo
      uses: actions/checkout@v3
    - name: check branch
      run: git branch
    - name: install required apps 
      run: sudo apt install pandoc texlive-xetex fossil fonts-firacode librsvg2-bin   
    - name: install font 
      run: cp -r src/font/ /usr/share/fonts/BrownStd    
    - name: remove render dir
      run: rm -rf src/render 
    - name: remake render dir
      run: mkdir src/render
    - name: run script
      run: cd src && ./local.sh 
    - name: install b2sdk
      run: pip3 install b2sdk
    - name: run python script
      env:
        BACKBLAZE_APP_KEY: ${{ secrets.BACKBLAZE_APP_KEY }}
        BACKBLAZE_APP_KEY_ID: ${{ secrets.BACKBLAZE_APP_KEY_ID }}
        BRANCH_NAME: ${{ github.ref }}
      run: python3 src/push_pdf.py
    - name: update readme link
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add *
        git commit -a -m "pdf generated"
        git push




