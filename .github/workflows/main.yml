name: compile_manual
on:
  push:
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: checkout repo
      uses: actions/checkout@v3
    - name: check branch
      run: git branch
    - name: temp
      run: docker version
    - name: docker image
      run: cd src && docker compose up -d
    - name: build process
      run: docker exec manual /app/src/build.sh
