name: compile_manual
on:
  push:
    branches:
      - 'main'
      - 'develop'
jobs:
  compile:
    runs-on: ubuntu-latest 
    # permissions:
      # contents: write  
    steps:
    - name: checkout repo
      uses: actions/checkout@v3
    - name: check branch
      run: git branch
    - name: install required apps 
      run: sudo apt install pandoc texlive-xetex  
    - name: check dir
      run: ls -al  
    - name: install font 
      run: cp -r /manual/font/ /usr/share/fonts/BrownStd    
      
    - name: run compile script
      run: ./local.sh
    - name: check results
      run: ls -al      
