name: build_and_publish_pdf

on:
  workflow_dispatch:

jobs:
  build-and-publish-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs-exporter
          playwright install chromium
          playwright install-deps chromium

      - name: Build site with PDF
        run: mkdocs build

      - name: Sync PDF to Scaleway bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp site/assets/fiaf-cataloguing-manual.pdf s3://fiaf-cataloguing-manual/assets/fiaf-cataloguing-manual.pdf \
            --endpoint-url https://s3.fr-par.scw.cloud
